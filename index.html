<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUPER FLAPPY BRO.</title>
    <meta name="description" content="This is a cool game to play!" />

    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    
    <!-- Link to external JavaScript -->
    <script src="script.js" defer></script>
    <link rel="icon" type="ïmage/png" href="Assets/Mario.jpg" />
    
  </head>
  <body>
    <div id="game_container">
      <!-- Score display -->
      <div id="score">Score: 0</div>
      <!-- High score display -->
      &nbsp &nbsp &nbsp &nbsp &nbsp   <div id="high-score">High Score: 0</div>
      
      <div>
        <img id="bird" src="./Assets/download.png" alt="Bird" width="150" />
      </div>
      
      <!-- Button to start the game -->
      <button id="start-btn">Click 'space-bar' to start</button>
      
      <!-- Difficulty selection -->
      <select id="difficulty-select">
        <option value="easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
    </div>
  </body>
</html>
